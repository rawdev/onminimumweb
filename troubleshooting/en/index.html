<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryWeft Troubleshooting — onMINIMUM</title>
    <meta name="description" content="MemoryWeft troubleshooting">
    <!-- Fonts only matter for the onmin theme (in-site embed), but preconnected here. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&family=Noto+Sans+KR:wght@300;400;500&family=Inter:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* =========================================================
           This page is the MemoryWeft "troubleshooting source" pulled in
           via iframe externally. (no dates + keyword search)
           - default (plain) theme : neutral, featureless list box
           - ?theme=onmin          : styled to match the onMINIMUM site
           ========================================================= */

        :root {
            --line:   #dcdcd6;
            --txt:    #1c1c1a;
            --muted:  #8a8a82;
            --tag:    #5a5a52;
            --hover:  rgba(0, 0, 0, 0.015);
            --accent: #C4882A;
        }

        html, body { background: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, "Helvetica Neue", "Noto Sans KR", sans-serif;
            color: var(--txt);
            line-height: 1.65;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            padding: 16px;
        }

        /* SEARCH */
        .ts-search {
            position: relative;
            margin-bottom: 16px;
        }

        .ts-search input {
            width: 100%;
            font: inherit;
            font-size: 14px;
            color: var(--txt);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 11px 14px 11px 38px;
            outline: none;
            transition: border-color 0.2s;
        }

        .ts-search input:focus { border-color: var(--accent); }
        .ts-search input::placeholder { color: var(--muted); }

        .ts-search svg {
            position: absolute;
            left: 13px; top: 50%;
            transform: translateY(-50%);
            width: 15px; height: 15px;
            stroke: var(--muted);
            pointer-events: none;
        }

        .board {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #fff;
            overflow: hidden;
        }

        .row {
            padding: 20px 22px;
            border-bottom: 1px solid var(--line);
            transition: background 0.2s;
        }

        .row:last-child { border-bottom: none; }
        .row:hover { background: var(--hover); }
        .row[hidden] { display: none; }

        .row-head {
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap; margin-bottom: 8px;
        }

        .tag {
            font-size: 11px; letter-spacing: 0.04em;
            color: var(--tag);
            border: 1px solid var(--line);
            border-radius: 2px;
            padding: 1px 8px;
        }

        .subject {
            font-size: 16px; font-weight: 600;
            line-height: 1.4; margin-bottom: 6px;
        }

        .content {
            font-size: 14px; color: #4a4a44; line-height: 1.8;
        }

        .empty {
            padding: 48px 20px; text-align: center;
            color: var(--muted); font-size: 14px;
        }
        .empty[hidden] { display: none; }

        /* =========================================================
           ONMIN theme — matches the onMINIMUM site (iframe parent)
           Applied only when body.theme-onmin
           ========================================================= */
        body.theme-onmin {
            --border: #E0DFD6;
            background: transparent;
            color: #0F0F0D;
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            padding: 0;
        }

        body.theme-onmin .ts-search { margin-bottom: 8px; }

        body.theme-onmin .ts-search input {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 14px 16px 14px 42px;
            font-size: 14px;
            letter-spacing: 0.02em;
        }

        body.theme-onmin .board {
            border: none;
            border-radius: 0;
            background: transparent;
            overflow: visible;
        }

        body.theme-onmin .row {
            border-bottom: none;
            border-top: 1px solid var(--border);
            padding: 36px 4px;
            transition: background 0.3s;
        }

        body.theme-onmin .row:last-child { border-bottom: 1px solid var(--border); }
        body.theme-onmin .row:hover { background: rgba(196, 136, 42, 0.03); }

        body.theme-onmin .row-head {
            gap: 16px; margin-bottom: 14px;
        }

        body.theme-onmin .tag {
            font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--accent); font-family: 'Inter', sans-serif;
            border: 1px solid var(--accent);
            border-radius: 2px; padding: 3px 10px;
        }

        body.theme-onmin .subject {
            font-family: 'Noto Serif KR', serif;
            font-weight: 400; font-size: 20px;
            line-height: 1.45; margin-bottom: 14px;
        }

        body.theme-onmin .content {
            font-size: 14.5px; line-height: 1.95; color: #484840;
        }

        body.theme-onmin .empty { color: #88887E; }
    </style>
</head>
<body>

    <!-- SEARCH -->
    <div class="ts-search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="ts-search-input"
               placeholder="Search (e.g. MCP, install)"
               autocomplete="off" aria-label="Search troubleshooting">
    </div>

    <!--
        ▸ To add a new item:
          copy the <article class="row"> block below, paste it at the TOP of board,
          and edit the category (tag) / title (subject) / body (content).
    -->
    <div class="board" id="ts-board">

        <article class="row">
            <div class="row-head">
                <span class="tag">MCP</span>
            </div>
            <h2 class="subject">When MCP tools don't appear in Claude Desktop</h2>
            <p class="content">
                After installing the MCP in Claude Desktop, if you can't verify
                that it's working, type "Check the Mweft MCP tools" in the chat window.
            </p>
        </article>

    </div>

    <div class="empty" id="ts-empty" hidden>No results found.</div>

    <script>
        // Theme: ?theme=onmin renders with the onMINIMUM site design
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get('theme') === 'onmin') {
                document.body.classList.add('theme-onmin');
            }
        })();

        // Keyword search: show only items whose title/body/tag text contains the query
        (function () {
            var input = document.getElementById('ts-search-input');
            var rows  = Array.prototype.slice.call(document.querySelectorAll('#ts-board .row'));
            var empty = document.getElementById('ts-empty');

            function normalize(s) { return (s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

            // Pre-compute searchable text for each item
            rows.forEach(function (row) {
                row._text = normalize(row.textContent);
            });

            function filter() {
                var q = normalize(input.value);
                var visible = 0;
                rows.forEach(function (row) {
                    var match = (q === '' || row._text.indexOf(q) !== -1);
                    row.hidden = !match;
                    if (match) visible++;
                });
                empty.hidden = (visible !== 0);
            }

            input.addEventListener('input', filter);
        })();

        // iframe auto-height: report content height to the parent (avoids inner scrollbars)
        (function () {
            if (window.parent === window) return; // standalone page: skip

            function postHeight() {
                var h = Math.ceil(document.body.getBoundingClientRect().height);
                window.parent.postMessage(
                    { type: 'onmin-notice-height', channel: 'troubleshooting', height: h }, '*'
                );
            }

            window.addEventListener('load', postHeight);
            window.addEventListener('resize', postHeight);
            document.addEventListener('input', postHeight);

            if (window.ResizeObserver) {
                new ResizeObserver(postHeight).observe(document.body);
            } else {
                setTimeout(postHeight, 400);
            }
        })();
    </script>

</body>
</html>
