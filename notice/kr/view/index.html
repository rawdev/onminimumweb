<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 — 온MINIMUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&family=Noto+Sans+KR:wght@300;400;500&family=Inter:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:           #FAFAF7;
            --text:         #0F0F0D;
            --text-muted:   #88887E;
            --accent:       #C4882A;
            --border:       #E0DFD6;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 24px 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(250, 250, 247, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none; color: var(--text);
        }

        .nav-mark { width: 30px; height: 30px; }

        .nav-wordmark {
            font-family: 'Noto Serif KR', serif;
            font-weight: 300; font-size: 15px; letter-spacing: 0.08em;
        }

        .nav-wordmark .on { color: var(--accent); }

        .nav-links { display: flex; gap: 40px; list-style: none; }

        .nav-links a {
            text-decoration: none; color: var(--text-muted);
            font-size: 13px; letter-spacing: 0.07em; transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--text); }
        .nav-links a.active { color: var(--text); }

        .nav-lang {
            color: var(--accent) !important;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.1em; font-weight: 400;
        }

        /* PAGE HEADER */
        .page-head {
            max-width: 880px;
            margin: 0 auto;
            padding: 200px 52px 60px;
            text-align: center;
        }

        .page-label {
            font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 24px; font-weight: 400;
            font-family: 'Inter', sans-serif;
        }

        .page-title {
            font-family: 'Noto Serif KR', serif;
            font-weight: 200;
            font-size: clamp(38px, 6vw, 64px);
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .page-sub {
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 14px; letter-spacing: 0.05em;
        }

        /* NOTICE EMBED (iframe → /notice/kr/) */
        .notice-wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 40px 52px 140px;
        }

        #notice-frame {
            display: block;
            width: 100%;
            border: 0;
            background: transparent;
            overflow: hidden;
            /* 로딩 직후 깜빡임/접힘 방지용 최소 높이. 로드 후 스크립트가 실제 높이로 조정. */
            min-height: 240px;
            transition: height 0.2s ease;
        }

        /* FOOTER */
        footer {
            padding: 40px 52px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .footer-logo {
            font-family: 'Noto Serif KR', serif; font-weight: 300;
            font-size: 14px; letter-spacing: 0.08em;
            display: flex; align-items: center; gap: 10px;
        }

        .footer-logo .on { color: var(--accent); }

        .footer-copy {
            font-size: 12px; color: var(--text-muted);
            letter-spacing: 0.05em; font-family: 'Inter', sans-serif;
        }

        @media (max-width: 900px) {
            nav { padding: 20px 28px; }
            .nav-links { gap: 22px; }
            .page-head { padding: 150px 28px 40px; }
            .notice-wrap { padding: 30px 28px 100px; }
            footer { flex-direction: column; gap: 14px; text-align: center; padding: 36px 28px; }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav id="main-nav">
        <a href="/" class="nav-logo">
            <svg class="nav-mark" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="15" cy="15" r="13.5" stroke="#0F0F0D" stroke-width="0.9"/>
                <circle cx="15" cy="15" r="2.6" fill="#C4882A"/>
            </svg>
            <span class="nav-wordmark"><span class="on">온</span>MINIMUM</span>
        </a>
        <ul class="nav-links">
            <li><a href="/#about">소개</a></li>
            <li><a href="/#values">철학</a></li>
            <li><a href="/#services">서비스</a></li>
            <li><a href="/notice/kr/view/" class="active">공지</a></li>
            <li><a href="/notice/en/view/" class="nav-lang">EN</a></li>
        </ul>
    </nav>

    <!-- PAGE HEADER -->
    <header class="page-head">
        <p class="page-label">Notice</p>
        <h1 class="page-title">공지사항</h1>
        <p class="page-sub">온MINIMUM의 소식과 안내를 전합니다.</p>
    </header>

    <!-- NOTICE LIST (외부 공유용 원본 /notice/kr/ 을 iframe으로 임베드) -->
    <main class="notice-wrap">
        <iframe id="notice-frame"
                src="/notice/kr/?theme=onmin"
                title="온MINIMUM 공지사항"
                scrolling="no"
                loading="lazy"></iframe>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-logo">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <circle cx="11" cy="11" r="10" stroke="#0F0F0D" stroke-width="0.8"/>
                <circle cx="11" cy="11" r="2.2" fill="#C4882A"/>
            </svg>
            <span><span class="on">온</span>MINIMUM</span>
        </div>
        <div class="footer-copy">
            &copy; 2025 온MINIMUM. All rights reserved.
        </div>
    </footer>

    <script>
        // 임베드한 공지 iframe 의 높이를 콘텐츠에 맞춰 자동 조정 → 내부 스크롤바 제거
        (function () {
            var frame = document.getElementById('notice-frame');
            window.addEventListener('message', function (e) {
                var data = e.data;
                if (data && data.type === 'onmin-notice-height' && data.height) {
                    frame.style.height = data.height + 'px';
                }
            });
        })();
    </script>

</body>
</html>
