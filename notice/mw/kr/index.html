<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryWeft 공지사항 — 온MINIMUM</title>
    <meta name="description" content="MemoryWeft 공지사항">
    <!-- 폰트는 onmin 테마(사이트 내 임베드)에서만 의미가 있으나, 미리 연결해 둡니다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&family=Noto+Sans+KR:wght@300;400;500&family=Inter:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* =========================================================
           이 페이지는 외부에서 iframe으로 끌어다 쓰는 MemoryWeft "공지 원본"입니다.
           - 기본(plain) 테마: 특색 없는 중립적인 리스트 박스
           - ?theme=onmin    : 온MINIMUM 사이트 디자인에 맞춘 테마
           최신 공지가 항상 맨 위에 오도록 작성합니다.
           ========================================================= */

        :root {
            --line:   #dcdcd6;
            --txt:    #1c1c1a;
            --muted:  #8a8a82;
            --tag:    #5a5a52;
            --hover:  rgba(0, 0, 0, 0.015);
        }

        html, body { background: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Noto Sans KR", Roboto, "Helvetica Neue", sans-serif;
            color: var(--txt);
            line-height: 1.65;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            padding: 16px;
        }

        .board {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #fff;
            overflow: hidden;
        }

        .row {
            padding: 20px 22px;
            border-bottom: 1px solid var(--line);
            transition: background 0.2s;
        }

        .row:last-child { border-bottom: none; }
        .row:hover { background: var(--hover); }

        .row-head {
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap; margin-bottom: 8px;
        }

        .tag {
            font-size: 11px; letter-spacing: 0.04em;
            color: var(--tag);
            border: 1px solid var(--line);
            border-radius: 2px;
            padding: 1px 8px;
        }

        .date {
            font-size: 12px; color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .subject {
            font-size: 16px; font-weight: 600;
            line-height: 1.4; margin-bottom: 6px;
        }

        .content {
            font-size: 14px; color: #4a4a44; line-height: 1.8;
        }

        .empty {
            padding: 48px 20px; text-align: center;
            color: var(--muted); font-size: 14px;
        }

        /* =========================================================
           ONMIN 테마 — 온MINIMUM 사이트(iframe 부모)와 어울리는 스타일
           body.theme-onmin 일 때만 적용
           ========================================================= */
        body.theme-onmin {
            --accent: #C4882A;
            --border: #E0DFD6;
            background: transparent;
            color: #0F0F0D;
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            padding: 0;
        }

        body.theme-onmin .board {
            border: none;
            border-radius: 0;
            background: transparent;
            overflow: visible;
        }

        body.theme-onmin .row {
            border-bottom: none;
            border-top: 1px solid var(--border);
            padding: 40px 4px;
            transition: background 0.3s;
        }

        body.theme-onmin .row:last-child { border-bottom: 1px solid var(--border); }
        body.theme-onmin .row:hover { background: rgba(196, 136, 42, 0.03); }

        body.theme-onmin .row-head {
            gap: 16px; margin-bottom: 14px;
        }

        body.theme-onmin .tag {
            font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--accent); font-family: 'Inter', sans-serif;
            border: 1px solid var(--accent);
            border-radius: 2px; padding: 3px 10px;
        }

        body.theme-onmin .date {
            font-size: 12px; color: #88887E;
            font-family: 'Inter', sans-serif; letter-spacing: 0.04em;
        }

        body.theme-onmin .subject {
            font-family: 'Noto Serif KR', serif;
            font-weight: 400; font-size: 21px;
            line-height: 1.45; margin-bottom: 14px;
        }

        body.theme-onmin .content {
            font-size: 14.5px; line-height: 1.95; color: #484840;
        }

        body.theme-onmin .empty { color: #88887E; }
    </style>
</head>
<body>

    <!--
        ▸ 새 공지 추가 방법:
          아래 <article class="row"> 블록을 복사해 board 맨 위에 붙여넣고
          분류(tag) · 날짜(date) · 제목(subject) · 내용(content)만 바꾸면 됩니다.
          항상 최신 공지가 맨 위에 오도록 합니다.
    -->
    <div class="board">

        <article class="row">
            <div class="row-head">
                <span class="tag">안내</span>
                <span class="date">2026.06.07</span>
            </div>
            <h2 class="subject">MemoryWeft 공지사항 채널 개설</h2>
            <p class="content">
                MemoryWeft의 소식을 전하는 공지사항 채널이 새로 개설되었습니다.
                앞으로 MemoryWeft 관련 업데이트와 안내 사항을
                이 채널을 통해 안내해 드리겠습니다.
            </p>
        </article>

    </div>

    <script>
        // 테마 적용: ?theme=onmin 이면 온MINIMUM 사이트 디자인으로 렌더링
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get('theme') === 'onmin') {
                document.body.classList.add('theme-onmin');
            }
        })();

        // iframe 자동 높이: 부모 창에 콘텐츠 높이를 전달 (내부 스크롤바 방지)
        (function () {
            if (window.parent === window) return; // 단독 페이지면 동작 안 함

            function postHeight() {
                var h = Math.ceil(document.body.getBoundingClientRect().height);
                window.parent.postMessage(
                    { type: 'onmin-notice-height', channel: 'memoryweft', height: h }, '*'
                );
            }

            window.addEventListener('load', postHeight);
            window.addEventListener('resize', postHeight);

            if (window.ResizeObserver) {
                new ResizeObserver(postHeight).observe(document.body);
            } else {
                // 폴백: 폰트 로딩 등으로 높이가 변할 수 있어 한 번 더 보정
                setTimeout(postHeight, 400);
            }
        })();
    </script>

</body>
</html>
