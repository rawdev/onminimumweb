<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice — onMINIMUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&family=Noto+Sans+KR:wght@300;400;500&family=Inter:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:           #FAFAF7;
            --text:         #0F0F0D;
            --text-muted:   #88887E;
            --accent:       #C4882A;
            --border:       #E0DFD6;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 24px 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(250, 250, 247, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none; color: var(--text);
        }

        .nav-mark { width: 30px; height: 30px; }

        .nav-wordmark {
            font-family: 'Noto Serif KR', serif;
            font-weight: 300; font-size: 15px; letter-spacing: 0.08em;
        }

        .nav-wordmark .on { color: var(--accent); }

        .nav-links { display: flex; gap: 40px; list-style: none; }

        .nav-links a {
            text-decoration: none; color: var(--text-muted);
            font-size: 13px; letter-spacing: 0.07em; transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--text); }
        .nav-links a.active { color: var(--text); }

        .nav-lang {
            color: var(--accent) !important;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.1em; font-weight: 400;
        }

        /* PAGE HEADER */
        .page-head {
            max-width: 880px;
            margin: 0 auto;
            padding: 200px 52px 60px;
            text-align: center;
        }

        .page-label {
            font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 24px; font-weight: 400;
            font-family: 'Inter', sans-serif;
        }

        .page-title {
            font-family: 'Noto Serif KR', serif;
            font-weight: 200;
            font-size: clamp(38px, 6vw, 64px);
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .page-sub {
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 14px; letter-spacing: 0.05em;
        }

        /* NOTICE LAYOUT — left tabs + notice body on the right */
        .notice-layout {
            max-width: 1080px;
            margin: 0 auto;
            padding: 40px 52px 140px;
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 48px;
            align-items: start;
        }

        /* LEFT TABS */
        .notice-tabs {
            position: sticky;
            top: 110px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            list-style: none;
        }

        .notice-tab {
            appearance: none;
            background: none;
            border: 0;
            border-left: 2px solid var(--border);
            text-align: left;
            padding: 12px 18px;
            cursor: pointer;
            color: var(--text-muted);
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.03em;
            line-height: 1.5;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .notice-tab:hover { color: var(--text); }

        .notice-tab.active {
            color: var(--text);
            font-weight: 500;
            border-left-color: var(--accent);
            background: rgba(196, 136, 42, 0.04);
        }

        /* RIGHT CONTENT (iframe panels) */
        .notice-content { min-width: 0; }

        .notice-panel { display: none; }
        .notice-panel.active { display: block; }

        .notice-frame {
            display: block;
            width: 100%;
            border: 0;
            background: transparent;
            overflow: hidden;
            /* Min height prevents collapse/flicker before the script sets the real height. */
            min-height: 240px;
            transition: height 0.2s ease;
        }

        /* FOOTER */
        footer {
            padding: 40px 52px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .footer-logo {
            font-family: 'Noto Serif KR', serif; font-weight: 300;
            font-size: 14px; letter-spacing: 0.08em;
            display: flex; align-items: center; gap: 10px;
        }

        .footer-logo .on { color: var(--accent); }

        .footer-copy {
            font-size: 12px; color: var(--text-muted);
            letter-spacing: 0.05em; font-family: 'Inter', sans-serif;
        }

        @media (max-width: 900px) {
            nav { padding: 20px 28px; }
            .nav-links { gap: 22px; }
            .page-head { padding: 150px 28px 40px; }
            .notice-layout {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 30px 28px 100px;
            }
            .notice-tabs {
                position: static;
                flex-direction: row;
                gap: 8px;
                border-bottom: 1px solid var(--border);
                padding-bottom: 4px;
            }
            .notice-tab {
                border-left: 0;
                border-bottom: 2px solid transparent;
                padding: 10px 14px;
            }
            .notice-tab.active {
                border-left: 0;
                border-bottom-color: var(--accent);
                background: none;
            }
            footer { flex-direction: column; gap: 14px; text-align: center; padding: 36px 28px; }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav id="main-nav">
        <a href="/en/" class="nav-logo">
            <svg class="nav-mark" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="15" cy="15" r="13.5" stroke="#0F0F0D" stroke-width="0.9"/>
                <circle cx="15" cy="15" r="2.6" fill="#C4882A"/>
            </svg>
            <span class="nav-wordmark"><span class="on">on</span>MINIMUM</span>
        </a>
        <ul class="nav-links">
            <li><a href="/en/#about">About</a></li>
            <li><a href="/en/#values">Philosophy</a></li>
            <li><a href="/en/#services">Services</a></li>
            <li><a href="/notice/en/view/" class="active">Notice</a></li>
            <li><a href="/notice/kr/view/" class="nav-lang">KO</a></li>
        </ul>
    </nav>

    <!-- PAGE HEADER -->
    <header class="page-head">
        <p class="page-label">Notice</p>
        <h1 class="page-title">Notice</h1>
        <p class="page-sub">News and announcements from onMINIMUM.</p>
    </header>

    <!-- NOTICE LAYOUT: left tabs switch the channel, the shareable source is embedded via iframe -->
    <main class="notice-layout">
        <!-- LEFT TABS -->
        <ul class="notice-tabs" role="tablist" aria-label="Notice channels">
            <li>
                <button class="notice-tab active" type="button"
                        role="tab" aria-selected="true"
                        data-target="panel-onmin">onMINIMUM Notice</button>
            </li>
            <li>
                <button class="notice-tab" type="button"
                        role="tab" aria-selected="false"
                        data-target="panel-memoryweft">MemoryWeft Notice</button>
            </li>
        </ul>

        <!-- RIGHT CONTENT -->
        <div class="notice-content">
            <section class="notice-panel active" id="panel-onmin" role="tabpanel">
                <iframe class="notice-frame" data-channel="onmin"
                        src="/notice/en/?theme=onmin"
                        title="onMINIMUM notices"
                        scrolling="no"></iframe>
            </section>
            <section class="notice-panel" id="panel-memoryweft" role="tabpanel">
                <iframe class="notice-frame" data-channel="memoryweft"
                        src="/notice/mw/en/?theme=onmin"
                        title="MemoryWeft notices"
                        scrolling="no"
                        loading="lazy"></iframe>
            </section>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-logo">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <circle cx="11" cy="11" r="10" stroke="#0F0F0D" stroke-width="0.8"/>
                <circle cx="11" cy="11" r="2.2" fill="#C4882A"/>
            </svg>
            <span><span class="on">on</span>MINIMUM</span>
        </div>
        <div class="footer-copy">
            &copy; 2025 onMINIMUM. All rights reserved.
        </div>
    </footer>

    <script>
        // Auto-fit each channel's iframe to its content height → no inner scrollbar
        (function () {
            var frames = {};
            document.querySelectorAll('.notice-frame').forEach(function (f) {
                frames[f.getAttribute('data-channel')] = f;
            });

            window.addEventListener('message', function (e) {
                var data = e.data;
                if (!data || data.type !== 'onmin-notice-height' || !data.height) return;
                // Find the target iframe by channel, falling back to e.source matching
                var frame = frames[data.channel];
                if (!frame) {
                    for (var key in frames) {
                        if (frames[key].contentWindow === e.source) { frame = frames[key]; break; }
                    }
                }
                if (frame) frame.style.height = data.height + 'px';
            });
        })();

        // Left tab switching
        (function () {
            var tabs = document.querySelectorAll('.notice-tab');
            tabs.forEach(function (tab) {
                tab.addEventListener('click', function () {
                    tabs.forEach(function (t) {
                        t.classList.remove('active');
                        t.setAttribute('aria-selected', 'false');
                    });
                    document.querySelectorAll('.notice-panel').forEach(function (p) {
                        p.classList.remove('active');
                    });
                    tab.classList.add('active');
                    tab.setAttribute('aria-selected', 'true');
                    document.getElementById(tab.getAttribute('data-target')).classList.add('active');
                });
            });
        })();
    </script>

</body>
</html>
